<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1192" viewBox="0 0 1120 1192" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8FBF9"/><stop offset="1" stop-color="#EEF5F1"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto"><path d="M0.5,0.8 L7.5,4.5 L0.5,8.2 z" fill="#9DB6AC"/></marker></defs>
<rect width="1120" height="1192" fill="url(#bg)"/>
<text x="72" y="64" font-size="29" font-weight="700" fill="#17332B">绿账本 · 数据中心能效与碳排数据清洗流水线</text>
<text x="72" y="96" font-size="14.5" fill="#5B6F68">九个节点：确定性计算交给代码，模型只负责叙述；④ 处人工确认，⑧ 之后可选用大模型润色</text>
<line x1="72" y1="126" x2="96" y2="126" stroke="#1F6F5C" stroke-width="3" stroke-linecap="round"/>
<text x="104" y="131" font-size="12.5" fill="#4A5A55">代码（确定性）</text>
<line x1="217.5" y1="126" x2="241.5" y2="126" stroke="#3E514B" stroke-width="3" stroke-linecap="round"/>
<text x="249.5" y="131" font-size="12.5" fill="#4A5A55">规则 / 配置</text>
<line x1="346.125" y1="126" x2="370.125" y2="126" stroke="#B7791F" stroke-width="3" stroke-dasharray="5 4" stroke-linecap="round"/>
<text x="378.125" y="131" font-size="12.5" fill="#4A5A55">人工确认点</text>
<line x1="466.625" y1="126" x2="490.625" y2="126" stroke="#8A9A94" stroke-width="3" stroke-dasharray="5 4" stroke-linecap="round"/>
<text x="498.625" y="131" font-size="12.5" fill="#4A5A55">可选：大模型润色</text>
<rect x="72" y="186" width="580" height="78" rx="13" fill="#FFFFFF" stroke="#1F6F5C" stroke-width="1.6"/>
<circle cx="112" cy="217.0" r="16" fill="#E9F2EE" stroke="#1F6F5C" stroke-width="1.2"/>
<text x="112" y="223.0" font-size="15.5" font-weight="700" fill="#1F6F5C" text-anchor="middle">1</text>
<text x="112" y="243.0" font-size="9.5" fill="#93A49E" text-anchor="middle">CODE</text>
<text x="148" y="216" font-size="16.5" font-weight="700" fill="#17332B">接入 / 文件接收</text>
<text x="148" y="240" font-size="12.5" fill="#5B6F68">读取 CSV 或 Excel；自动识别 UTF-8 / GBK 编码</text>
<line x1="652" y1="225.0" x2="678" y2="225.0" stroke="#D3E2DA" stroke-width="1" stroke-dasharray="3 4"/>
<rect x="690" y="190.0" width="370" height="70" rx="10" fill="#FFFFFF" stroke="#E4EBE7"/>
<text x="703" y="210.0" font-size="11" font-weight="700" fill="#B7791F">为什么</text>
<text x="703" y="229.0" font-size="11.5" fill="#4A5A55">换行、合并表头、GBK 编码是台账三大坑：先保证“读得进”，后</text>
<text x="703" y="247.0" font-size="11.5" fill="#4A5A55">面才有意义</text>
<line x1="112" y1="266" x2="112" y2="287" stroke="#9DB6AC" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="72" y="290" width="580" height="78" rx="13" fill="#FFFFFF" stroke="#1F6F5C" stroke-width="1.6"/>
<circle cx="112" cy="321.0" r="16" fill="#E9F2EE" stroke="#1F6F5C" stroke-width="1.2"/>
<text x="112" y="327.0" font-size="15.5" font-weight="700" fill="#1F6F5C" text-anchor="middle">2</text>
<text x="112" y="347.0" font-size="9.5" fill="#93A49E" text-anchor="middle">CODE</text>
<text x="148" y="320" font-size="16.5" font-weight="700" fill="#17332B">解析为二维表</text>
<text x="148" y="344" font-size="12.5" fill="#5B6F68">统一成“表头 + 行”的结构，表头去重</text>
<line x1="652" y1="329.0" x2="678" y2="329.0" stroke="#D3E2DA" stroke-width="1" stroke-dasharray="3 4"/>
<rect x="690" y="303.0" width="370" height="52" rx="10" fill="#FFFFFF" stroke="#E4EBE7"/>
<text x="703" y="323.0" font-size="11" font-weight="700" fill="#B7791F">为什么</text>
<text x="703" y="342.0" font-size="11.5" fill="#4A5A55">把文件变成程序可计算的结构，后续所有规则都基于这张表</text>
<line x1="112" y1="370" x2="112" y2="391" stroke="#9DB6AC" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="72" y="394" width="580" height="78" rx="13" fill="#FFFFFF" stroke="#1F6F5C" stroke-width="1.6"/>
<circle cx="112" cy="425.0" r="16" fill="#E9F2EE" stroke="#1F6F5C" stroke-width="1.2"/>
<text x="112" y="431.0" font-size="15.5" font-weight="700" fill="#1F6F5C" text-anchor="middle">3</text>
<text x="112" y="451.0" font-size="9.5" fill="#93A49E" text-anchor="middle">CODE</text>
<text x="148" y="424" font-size="16.5" font-weight="700" fill="#17332B">数据体检</text>
<text x="148" y="448" font-size="12.5" fill="#5B6F68">缺失、重复、单位混用、日期格式、PUE 越界、逻辑冲突 → 0–100 健康分</text>
<line x1="652" y1="433.0" x2="678" y2="433.0" stroke="#D3E2DA" stroke-width="1" stroke-dasharray="3 4"/>
<rect x="690" y="398.0" width="370" height="70" rx="10" fill="#FFFFFF" stroke="#E4EBE7"/>
<text x="703" y="418.0" font-size="11" font-weight="700" fill="#B7791F">为什么</text>
<text x="703" y="437.0" font-size="11.5" fill="#4A5A55">先诊断再动手；没有体检的“清洗”往往拍脑袋，也说不清改了什</text>
<text x="703" y="455.0" font-size="11.5" fill="#4A5A55">么</text>
<line x1="112" y1="474" x2="112" y2="495" stroke="#9DB6AC" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="72" y="498" width="580" height="78" rx="13" fill="#FFFFFF" stroke="#B7791F" stroke-width="1.6" stroke-dasharray="6 4"/>
<circle cx="112" cy="529.0" r="16" fill="#E9F2EE" stroke="#B7791F" stroke-width="1.2"/>
<text x="112" y="535.0" font-size="15.5" font-weight="700" fill="#B7791F" text-anchor="middle">4</text>
<text x="112" y="555.0" font-size="9.5" fill="#93A49E" text-anchor="middle">RULE</text>
<text x="148" y="528" font-size="16.5" font-weight="700" fill="#17332B">生成清洗计划</text>
<text x="148" y="552" font-size="12.5" fill="#5B6F68">字段映射、单位换算、日期规范、去重键、填充规则、异常策略</text>
<line x1="652" y1="537.0" x2="678" y2="537.0" stroke="#D3E2DA" stroke-width="1" stroke-dasharray="3 4"/>
<rect x="690" y="502.0" width="370" height="70" rx="10" fill="#FFFFFF" stroke="#E4EBE7"/>
<text x="703" y="522.0" font-size="11" font-weight="700" fill="#B7791F">为什么</text>
<text x="703" y="541.0" font-size="11.5" fill="#4A5A55">把“做什么 + 为什么”写成可读计划，用户可勾选确认——而不是</text>
<text x="703" y="559.0" font-size="11.5" fill="#4A5A55">模型悄悄决定</text>
<line x1="112" y1="578" x2="112" y2="599" stroke="#9DB6AC" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="72" y="602" width="580" height="78" rx="13" fill="#FFFFFF" stroke="#1F6F5C" stroke-width="1.6"/>
<circle cx="112" cy="633.0" r="16" fill="#E9F2EE" stroke="#1F6F5C" stroke-width="1.2"/>
<text x="112" y="639.0" font-size="15.5" font-weight="700" fill="#1F6F5C" text-anchor="middle">5</text>
<text x="112" y="659.0" font-size="9.5" fill="#93A49E" text-anchor="middle">CODE</text>
<text x="148" y="632" font-size="16.5" font-weight="700" fill="#17332B">执行清洗</text>
<text x="148" y="656" font-size="12.5" fill="#5B6F68">按计划逐条执行，每一处改动记入改动明细（行号 + 标记）</text>
<line x1="652" y1="641.0" x2="678" y2="641.0" stroke="#D3E2DA" stroke-width="1" stroke-dasharray="3 4"/>
<rect x="690" y="615.0" width="370" height="52" rx="10" fill="#FFFFFF" stroke="#E4EBE7"/>
<text x="703" y="635.0" font-size="11" font-weight="700" fill="#B7791F">为什么</text>
<text x="703" y="654.0" font-size="11.5" fill="#4A5A55">确定性执行才能复现：同一份数据跑两次结果一致，答辩时说得清</text>
<line x1="112" y1="682" x2="112" y2="703" stroke="#9DB6AC" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="72" y="706" width="580" height="78" rx="13" fill="#FFFFFF" stroke="#1F6F5C" stroke-width="1.6"/>
<circle cx="112" cy="737.0" r="16" fill="#E9F2EE" stroke="#1F6F5C" stroke-width="1.2"/>
<text x="112" y="743.0" font-size="15.5" font-weight="700" fill="#1F6F5C" text-anchor="middle">6</text>
<text x="112" y="763.0" font-size="9.5" fill="#93A49E" text-anchor="middle">CODE</text>
<text x="148" y="736" font-size="16.5" font-weight="700" fill="#17332B">指标计算</text>
<text x="148" y="760" font-size="12.5" fill="#5B6F68">PUE、绿电占比、碳排、电费、月度序列；公式写死在代码里</text>
<line x1="652" y1="745.0" x2="678" y2="745.0" stroke="#D3E2DA" stroke-width="1" stroke-dasharray="3 4"/>
<rect x="690" y="719.0" width="370" height="52" rx="10" fill="#FFFFFF" stroke="#E4EBE7"/>
<text x="703" y="739.0" font-size="11" font-weight="700" fill="#B7791F">为什么</text>
<text x="703" y="758.0" font-size="11.5" fill="#4A5A55">不让模型口算数字；排放因子显式可改、来源可查</text>
<line x1="112" y1="786" x2="112" y2="807" stroke="#9DB6AC" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="72" y="810" width="580" height="78" rx="13" fill="#FFFFFF" stroke="#1F6F5C" stroke-width="1.6"/>
<circle cx="112" cy="841.0" r="16" fill="#E9F2EE" stroke="#1F6F5C" stroke-width="1.2"/>
<text x="112" y="847.0" font-size="15.5" font-weight="700" fill="#1F6F5C" text-anchor="middle">7</text>
<text x="112" y="867.0" font-size="9.5" fill="#93A49E" text-anchor="middle">CODE</text>
<text x="148" y="840" font-size="16.5" font-weight="700" fill="#17332B">可视化</text>
<text x="148" y="864" font-size="12.5" fill="#5B6F68">PUE 趋势、月度能耗、绿电占比，纯 SVG 绘制，无外部依赖</text>
<line x1="652" y1="849.0" x2="678" y2="849.0" stroke="#D3E2DA" stroke-width="1" stroke-dasharray="3 4"/>
<rect x="690" y="823.0" width="370" height="52" rx="10" fill="#FFFFFF" stroke="#E4EBE7"/>
<text x="703" y="843.0" font-size="11" font-weight="700" fill="#B7791F">为什么</text>
<text x="703" y="862.0" font-size="11.5" fill="#4A5A55">一张趋势图比十行数字更容易看出问题，也方便直接贴进月报</text>
<line x1="112" y1="890" x2="112" y2="911" stroke="#9DB6AC" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="72" y="914" width="580" height="78" rx="13" fill="#FFFFFF" stroke="#1F6F5C" stroke-width="1.6"/>
<circle cx="112" cy="945.0" r="16" fill="#E9F2EE" stroke="#1F6F5C" stroke-width="1.2"/>
<text x="112" y="951.0" font-size="15.5" font-weight="700" fill="#1F6F5C" text-anchor="middle">8</text>
<text x="112" y="971.0" font-size="9.5" fill="#93A49E" text-anchor="middle">CODE</text>
<text x="148" y="944" font-size="16.5" font-weight="700" fill="#17332B">报告拼装</text>
<text x="148" y="968" font-size="12.5" fill="#5B6F68">结论 → 质量对比 → 能效 → 绿色化 → 异常清单 → 建议 → 口径来源</text>
<line x1="652" y1="953.0" x2="678" y2="953.0" stroke="#D3E2DA" stroke-width="1" stroke-dasharray="3 4"/>
<rect x="690" y="927.0" width="370" height="52" rx="10" fill="#FFFFFF" stroke="#E4EBE7"/>
<text x="703" y="947.0" font-size="11" font-weight="700" fill="#B7791F">为什么</text>
<text x="703" y="966.0" font-size="11.5" fill="#4A5A55">固定结构保证输出稳定，第 7 段强制交代来源与假设</text>
<line x1="112" y1="994" x2="112" y2="1015" stroke="#9DB6AC" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="72" y="1018" width="580" height="78" rx="13" fill="#FFFFFF" stroke="#1F6F5C" stroke-width="1.6"/>
<circle cx="112" cy="1049.0" r="16" fill="#E9F2EE" stroke="#1F6F5C" stroke-width="1.2"/>
<text x="112" y="1055.0" font-size="15.5" font-weight="700" fill="#1F6F5C" text-anchor="middle">9</text>
<text x="112" y="1075.0" font-size="9.5" fill="#93A49E" text-anchor="middle">CODE</text>
<text x="148" y="1048" font-size="16.5" font-weight="700" fill="#17332B">输出与留痕</text>
<text x="148" y="1072" font-size="12.5" fill="#5B6F68">下载清洗后 CSV、报告 Markdown、打印 PDF；改动可追溯</text>
<line x1="652" y1="1057.0" x2="678" y2="1057.0" stroke="#D3E2DA" stroke-width="1" stroke-dasharray="3 4"/>
<rect x="690" y="1031.0" width="370" height="52" rx="10" fill="#FFFFFF" stroke="#E4EBE7"/>
<text x="703" y="1051.0" font-size="11" font-weight="700" fill="#B7791F">为什么</text>
<text x="703" y="1070.0" font-size="11.5" fill="#4A5A55">交付物要能被复核：数据从哪来、改了哪几行、结论基于什么</text>
<line x1="72" y1="1128" x2="1048" y2="1128" stroke="#DCE7E1" stroke-width="1"/>
<text x="72" y="1152" font-size="11.5" fill="#7C8D87">原则：能确定性计算的一律交给代码——同一份数据跑两次，清洗结果必须一致。</text>
<text x="72" y="1172" font-size="11.5" fill="#7C8D87">可选增强：把“指标 JSON + 规则引擎草稿”交给大模型改写措辞（不得改动数字），接口不通时用页面上的“复制提示词”。</text>
</svg>